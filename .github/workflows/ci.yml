name: CI

on:
    # dev is a free working branch — no build runs on a dev push. CI validates
    # pull requests; the real build/deploy happens on the prod push (deploy.yml).
    pull_request:
        branches: [dev, prod]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Build static export
              run: bun run build
