name: Deploy to GitHub Pages

on:
    push:
        branches: [prod]
    # A stepper release triggers this via the API with `ref: prod` (from stepper's
    # release.yml) for an instant rebuild, so the "latest release" badge + update
    # log reflect the new version right away.
    workflow_dispatch:
    schedule:
        # Static export has no ISR — rebuild daily so the "latest release" badge and
        # the update log (regenerated from the GitHub API at build) stay current even
        # without a release ping. Scheduled runs always fire on the default branch
        # (dev); the `redispatch` job bridges them onto prod.
        - cron: '0 6 * * *'

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    # The github-pages environment only allows deploys from prod, but the daily
    # cron always fires on the default branch (dev) and a manual dispatch can pick
    # any ref. Instead of failing at the deploy gate, any non-prod run re-runs
    # this workflow on prod and does nothing else. workflow_dispatch runs created
    # with the built-in GITHUB_TOKEN are exempt from the recursion guard, and the
    # spawned prod run takes the build path below — so this cannot loop.
    redispatch:
        if: github.ref_name != 'prod'
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Re-run this workflow on prod
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run deploy.yml --repo '${{ github.repository }}' --ref prod

    build:
        if: github.ref_name == 'prod'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Build static export
              env:
                  # Raise the GitHub API rate limit for the update-log generator
                  # (gen-update-log.ts reads stepper's tags/commits at build).
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bun run build
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: out

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
