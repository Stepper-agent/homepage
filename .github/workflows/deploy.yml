name: Deploy to GitHub Pages

on:
    push:
        branches: [prod]
    # A stepper release triggers this via the API with `ref: prod` (from stepper's
    # release.yml) for an instant rebuild, so the "latest release" badge + update
    # log reflect the new version right away. `workflow_dispatch` keeps the run on
    # prod (the only branch the github-pages environment allows to deploy); a
    # `repository_dispatch` would run on the default branch (dev) and be rejected.
    workflow_dispatch:
    schedule:
        # Static export has no ISR — rebuild daily so the "latest release" badge and
        # the update log (regenerated from the GitHub API at build) stay current even
        # without a release ping.
        - cron: '0 6 * * *'

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Build static export
              env:
                  # Raise the GitHub API rate limit for the update-log generator
                  # (gen-update-log.ts reads stepper's tags/commits at build).
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bun run build
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: out

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
